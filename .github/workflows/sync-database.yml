name: Sync station database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'stations/*.json'

concurrency:
  group: stations-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "meteostat-cli[contrib]"
      - name: Build stations database
        run: meteo station build --repo . --output ${{ runner.temp }}/stations.db
      - name: Keep inventory data
        run: |
          sqlite3 stations.db ".dump inventory" | sqlite3 ${{ runner.temp }}/stations.db
          mv ${{ runner.temp }}/stations.db stations.db
      - name: Upload stations database file via FTP
        run: |
          curl -T ./stations.db \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            -Q "-RNFR stations.db.tmp" -Q "-RNTO stations.db" \
            "ftp://${{ secrets.FTP_HOST }}/stations.db.tmp"
      - name: Commit Files
        run: |
          git config --local user.email "${{ vars.GIT_EMAIL }}"
          git config --local user.name "${{ vars.GIT_USER }}"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Sync stations" --allow-empty)
      - name: Push Changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
      - name: Import stations into remote database
        env:
          WEBHOOK_URL: ${{ vars.STATIONS_IMPORT_URL }}
          WEBHOOK_USER: ${{ secrets.STATIONS_IMPORT_USER }}
          WEBHOOK_PASSWORD: ${{ secrets.STATIONS_IMPORT_PASSWORD }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 -X POST \
            --user "$WEBHOOK_USER:$WEBHOOK_PASSWORD" \
            "$WEBHOOK_URL"
