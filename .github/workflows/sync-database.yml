name: Sync station database

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 2 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Remove stale DB file
        run: rm -f stations.db
      - name: Get inventory data
        run: mysql2sqlite -f stations.db -t inventory -d ${{ secrets.INVENTORY_DB }} -u ${{ secrets.INVENTORY_USER }} --mysql-password ${{ secrets.INVENTORY_PASSWORD }} -h ${{ secrets.INVENTORY_HOST }}
      - name: Get station data
        run: python database.py
      - name: Prepare station meta data for export
        run: |
          python - <<'EOF'
          import shutil, sqlite3
          shutil.copy('stations.db', '${{ runner.temp }}/export.db')
          conn = sqlite3.connect('${{ runner.temp }}/export.db')
          conn.execute('ALTER TABLE `stations` RENAME TO `stations_import`')
          conn.execute('ALTER TABLE `names` RENAME TO `stations_names_import`')
          conn.execute('ALTER TABLE `identifiers` RENAME TO `stations_identifiers_import`')
          conn.commit()
          conn.close()
          EOF
      - name: Insert station meta data into staging tables
        env:
          MYSQL_PWD: ${{ secrets.INVENTORY_PASSWORD }}
        run: |
          mysql -h ${{ secrets.INVENTORY_HOST }} -u ${{ secrets.INVENTORY_USER }} ${{ secrets.INVENTORY_DB }} <<'EOF'
          DROP TABLE IF EXISTS `stations_import`, `stations_names_import`, `stations_identifiers_import`;
          EOF
          sqlite3mysql -f ${{ runner.temp }}/export.db -t stations_import stations_names_import stations_identifiers_import -d ${{ secrets.INVENTORY_DB }} -u ${{ secrets.INVENTORY_USER }} --mysql-password ${{ secrets.INVENTORY_PASSWORD }} -h ${{ secrets.INVENTORY_HOST }}
      - name: Swap staging tables into place
        env:
          MYSQL_PWD: ${{ secrets.INVENTORY_PASSWORD }}
        run: |
          mysql -h ${{ secrets.INVENTORY_HOST }} -u ${{ secrets.INVENTORY_USER }} ${{ secrets.INVENTORY_DB }} <<'EOF'
          CREATE TABLE IF NOT EXISTS `stations` LIKE `stations_import`;
          CREATE TABLE IF NOT EXISTS `stations_names` LIKE `stations_names_import`;
          CREATE TABLE IF NOT EXISTS `stations_identifiers` LIKE `stations_identifiers_import`;
          DROP TABLE IF EXISTS `stations_old`, `stations_names_old`, `stations_identifiers_old`;
          RENAME TABLE
            `stations` TO `stations_old`, `stations_import` TO `stations`,
            `stations_names` TO `stations_names_old`, `stations_names_import` TO `stations_names`,
            `stations_identifiers` TO `stations_identifiers_old`, `stations_identifiers_import` TO `stations_identifiers`;
          DROP TABLE `stations_old`, `stations_names_old`, `stations_identifiers_old`;
          EOF
      - name: Upload stations database file via FTP
        run: |
          curl -T ./stations.db \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_HOST }}/stations.db"
      - name: Commit Files
        run: |
          git config --local user.email "${{ vars.GIT_EMAIL }}"
          git config --local user.name "${{ vars.GIT_USER }}"
          git add -A
          git diff-index --quiet HEAD || (git commit -a -m "Sync stations" --allow-empty)
      - name: Push Changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
